<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og source</title>
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 500;src:url(fonts/cormorant-garamond.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:300 500;src:url(fonts/cormorant-garamond-italic.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:300 500;src:url(fonts/jost.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;
  background:url("images/og-room.webp") center center / cover no-repeat,#1E3324;
  display:grid;place-items:center;text-align:center}
.card::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(84% 78% at 50% 46%, rgba(30,51,36,.06) 0%, rgba(30,51,36,.40) 62%, rgba(30,51,36,.72) 100%),
   linear-gradient(180deg, rgba(30,51,36,.26) 0%, rgba(30,51,36,.04) 36%, rgba(30,51,36,.62) 100%)}
.in{position:relative;display:grid;justify-items:center;gap:0}
img{display:block;width:214px;height:auto;filter:drop-shadow(0 18px 34px rgba(0,0,0,.35))}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:82px;line-height:1;
  color:#FBF0E3;margin-top:30px;letter-spacing:.005em;text-shadow:0 2px 26px rgba(20,34,24,.55)}
p.motto{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;
  font-size:44px;line-height:1;color:#C6D8B7;margin-top:16px;text-shadow:0 2px 22px rgba(20,34,24,.5)}
p.foot{font-family:'Jost',Arial,sans-serif;font-weight:300;font-size:17px;letter-spacing:.26em;
  text-transform:uppercase;color:rgba(251,240,227,.9);margin-top:40px;text-shadow:0 1px 16px rgba(20,34,24,.6)}
.rule{width:132px;height:1px;background:linear-gradient(90deg,rgba(220,195,163,0),#DCC3A3,rgba(220,195,163,0));margin-top:34px}
</style>
</head>
<body>
<div class="card">
  <div class="in">
    <img src="images/logo-1000.webp" alt="">
    <h1>Leo Club of Aurelian</h1>
    <p class="motto">Built on bonds.</p>
    <div class="rule"></div>
    <p class="foot">Leo District 3231 A4 &middot; Navi Mumbai, India</p>
  </div>
</div>
</body>
</html>
